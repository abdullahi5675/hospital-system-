<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Doctor — Clinic EMR</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>
<aside class="sidebar">
  <div class="sidebar-inner">
    <div class="sidebar-header">
      <div class="sidebar-brand">Clinic EMR <span>Admin Panel</span></div>
      <button class="sidebar-close-btn" onclick="closeSidebar()">✕</button>
    </div>
    <ul class="sidebar-menu">
      <li><a href="index.html">Dashboard</a></li>
      <li><a href="doctors.html">Manage Doctors</a></li>
      <li class="active"><a href="add_doctor.html">Add Doctor</a></li>
      <li><a href="patients.html">Manage Patients</a></li>
      <li><a href="add_patient.html">Add Patient</a></li>
      <li><a href="view_patients.html">Registry Directory</a></li>
    </ul>
    <div class="sidebar-footer">
      <div class="user-badge"><span class="user-name">Loading…</span><span class="user-role">Administrator</span></div>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>
  </div>
</aside>

<div class="main-wrapper">
  <div class="topbar">
    <button class="hamburger-btn" onclick="toggleSidebar()">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span class="topbar-title">Register New Doctor</span>
    <div class="topbar-right">
      <span class="topbar-role-badge">Admin</span>
    </div>
  </div>
  <div class="page-content">
    <div class="page-header">
      <div class="page-title"><h1>Register New Doctor</h1><p>Add a physician profile to the clinic roster</p></div>
    </div>
    <div class="card-section">
      <form id="add-doctor-form">
        <div class="form-grid">
          <div class="form-group"><label>Full Name</label><input type="text" id="name" placeholder="Dr. Jane Smith" required></div>
          <div class="form-group"><label>Email Address</label><input type="email" id="email" placeholder="jane@clinic.com" required></div>
          <div class="form-group"><label>Portal Password</label><input type="password" id="password" placeholder="Min. 6 characters" required></div>
          <div class="form-group"><label>Mobile Number</label><input type="tel" id="mobile_no" placeholder="0801 234 5678"></div>
          <div class="form-group"><label>Education &amp; Credentials</label><input type="text" id="education" placeholder="MBBS, MD Cardiology"></div>
          <div class="form-group full-width"><label>Professional Experience</label><textarea id="experience" placeholder="10 years cardiology practice at National Hospital…"></textarea></div>
        </div>
        <div class="btn-group">
          <button type="submit" class="btn-primary">Add Doctor</button>
          <a href="doctors.html" class="btn-secondary" style="text-decoration:none;display:inline-flex;align-items:center;padding:11px 22px;border-radius:8px;">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="status-banner" class="banner"></div>
<script src="js/app.js"></script>
<script>
window.onload = () => checkAuth(['Admin']);
document.getElementById('add-doctor-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res  = await fetch('/api/doctors', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name:document.getElementById('name').value, email:document.getElementById('email').value,
      password:document.getElementById('password').value, mobile_no:document.getElementById('mobile_no').value,
      education:document.getElementById('education').value, experience:document.getElementById('experience').value }) });
  const data = await res.json();
  showNotification(data.message, !data.success);
  if (data.success) setTimeout(() => window.location.href = 'doctors.html', 1000);
});
</script>
</body>
</html>
