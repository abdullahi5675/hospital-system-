<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Patient — Clinic EMR</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>
<aside class="sidebar">
  <div class="sidebar-inner">
    <div class="sidebar-header">
      <div class="sidebar-brand">Clinic EMR <span>Admin Panel</span></div>
      <button class="sidebar-close-btn" onclick="closeSidebar()">✕</button>
    </div>
    <ul class="sidebar-menu">
      <li><a href="index.html">Dashboard</a></li>
      <li><a href="doctors.html">Manage Doctors</a></li>
      <li><a href="add_doctor.html">Add Doctor</a></li>
      <li><a href="patients.html">Manage Patients</a></li>
      <li class="active"><a href="add_patient.html">Add Patient</a></li>
      <li><a href="view_patients.html">Registry Directory</a></li>
    </ul>
    <div class="sidebar-footer">
      <div class="user-badge"><span class="user-name">Loading…</span><span class="user-role">Administrator</span></div>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>
  </div>
</aside>

<div class="main-wrapper">
  <div class="topbar">
    <button class="hamburger-btn" onclick="toggleSidebar()">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span class="topbar-title">Add Patient</span>
    <div class="topbar-right">
      <span class="topbar-role-badge">Admin</span>
    </div>
  </div>
  <div class="page-content">
    <div class="page-header">
      <div class="page-title"><h1>Register New Patient</h1><p>Open an EMR folder for a new clinic patient</p></div>
    </div>
    <div class="card-section">
      <form id="add-patient-form">
        <div class="form-grid">
          <div class="form-group"><label>Full Name</label><input type="text" id="name" placeholder="John Doe" required></div>
          <div class="form-group"><label>Email Address</label><input type="email" id="email" placeholder="john@email.com" required></div>
          <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Min. 6 characters" required></div>
          <div class="form-group"><label>Gender</label>
            <select id="gender"><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select>
          </div>
          <div class="form-group"><label>Mobile Number</label><input type="tel" id="mobile_no" placeholder="0801 234 5678"></div>
          <div class="form-group"><label>City</label><input type="text" id="city" placeholder="Abuja"></div>
          <div class="form-group full-width"><label>Home Address</label><textarea id="address" placeholder="12 Baker Street…"></textarea></div>
        </div>
        <div class="btn-group">
          <button type="submit" class="btn-primary">Add Patient &amp; Open EMR</button>
          <a href="patients.html" class="btn-secondary" style="text-decoration:none;display:inline-flex;align-items:center;padding:11px 22px;border-radius:8px;">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="status-banner" class="banner"></div>
<script src="js/app.js"></script>
<script>
window.onload = () => checkAuth(['Admin']);
document.getElementById('add-patient-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res  = await fetch('/api/patients', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name:document.getElementById('name').value, email:document.getElementById('email').value,
      password:document.getElementById('password').value, gender:document.getElementById('gender').value,
      mobile_no:document.getElementById('mobile_no').value, city:document.getElementById('city').value,
      address:document.getElementById('address').value }) });
  const data = await res.json();
  showNotification(data.message, !data.success);
  if (data.success) setTimeout(() => window.location.href = 'patients.html', 1000);
});
</script>
</body>
</html>
