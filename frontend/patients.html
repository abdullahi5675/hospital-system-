<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Patients — Clinic EMR</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>
<aside class="sidebar">
  <div class="sidebar-inner">
    <div class="sidebar-header">
      <div class="sidebar-brand" id="role-brand">Clinic EMR <span id="role-sub">Admin Panel</span></div>
      <button class="sidebar-close-btn" onclick="closeSidebar()">✕</button>
    </div>
    <ul class="sidebar-menu" id="role-menu">
      <li><a href="index.html">Dashboard</a></li>
      <li><a href="doctors.html">Manage Doctors</a></li>
      <li><a href="add_doctor.html">Add Doctor</a></li>
      <li class="active"><a href="patients.html">Manage Patients</a></li>
      <li><a href="add_patient.html">Add Patient</a></li>
      <li><a href="view_patients.html">Registry Directory</a></li>
    </ul>
    <div class="sidebar-footer">
      <div class="user-badge"><span class="user-name">Loading…</span><span class="user-role">Loading…</span></div>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>
  </div>
</aside>

<div class="main-wrapper">
  <div class="topbar">
    <button class="hamburger-btn" onclick="toggleSidebar()">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span class="topbar-title">Patients Directory</span>
    <div class="topbar-right">
      <span class="topbar-role-badge" id="topbar-role">–</span>
    </div>
  </div>
  <div class="page-content">
    <div class="page-header">
      <div class="page-title"><h1>Patients Directory</h1><p>Manage patient bio-data and EMR folders</p></div>
      <a href="add_patient.html" class="btn-primary" id="add-patient-btn">+ Add Patient</a>
    </div>
    <div class="card-section">
      <div class="search-bar">
        <input type="text" id="pat-search" placeholder="Search by name or ID…" oninput="filterPatients()">
      </div>
      <div class="table-wrapper">
        <table id="patients-table">
          <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Gender</th><th>Actions</th></tr></thead>
          <tbody><tr><td colspan="6" class="text-center text-muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="status-banner" class="banner"></div>

<!-- Edit Patient Modal -->
<div id="edit-pat-modal" class="modal">
  <div class="modal-content">
    <h2>Edit Patient</h2>
    <form id="edit-pat-form">
      <input type="hidden" id="edit-pat-id">
      <div class="form-group" style="margin-bottom:12px;"><label>Full Name</label><input type="text" id="edit-pat-name" required></div>
      <div class="form-group" style="margin-bottom:12px;"><label>Gender</label>
        <select id="edit-pat-gender"><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select>
      </div>
      <div class="form-group" style="margin-bottom:12px;"><label>Mobile</label><input type="text" id="edit-pat-phone"></div>
      <div class="form-group" style="margin-bottom:12px;"><label>City</label><input type="text" id="edit-pat-city"></div>
      <div class="form-group" style="margin-bottom:16px;"><label>Address</label><textarea id="edit-pat-addr"></textarea></div>
      <div class="btn-group">
        <button type="button" class="btn-secondary" onclick="closeModal('edit-pat-modal')">Cancel</button>
        <button type="submit" class="btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
<script>
let patients = [], activeUser = null;
async function init() {
  activeUser = await checkAuth(['Admin','Doctor']);
  if (!activeUser) return;
  document.getElementById('topbar-role').textContent = activeUser.role;
  if (activeUser.role === 'Doctor') {
    document.getElementById('role-sub').textContent = 'Doctor Panel';
    document.getElementById('role-menu').innerHTML = `
      <li><a href="doctor.html">Dashboard</a></li>
      <li class="active"><a href="patients.html">Patients Directory</a></li>
      <li><a href="view_patients.html">Registry Directory</a></li>`;
    document.getElementById('add-patient-btn').style.display = 'none';
  }
  const res  = await fetch('/api/patients');
  const data = await res.json();
  if (data.success) { patients = data.patients; renderPatients(patients); }
}
function renderPatients(list) {
  const body = document.querySelector('#patients-table tbody');
  body.innerHTML = list.length === 0 ? '<tr><td colspan="6" class="text-center text-muted">No patients found.</td></tr>' : '';
  list.forEach(p => {
    const editBtn = activeUser.role === 'Admin'
      ? `<button class="btn-action approve" onclick='openPatEdit(${JSON.stringify(p)})'>Edit Bio</button>` : '';
    body.innerHTML += `<tr>
      <td>#${p.user_id}</td><td><strong>${p.name}</strong></td><td>${p.email}</td>
      <td>${p.mobile_no||'–'}</td><td>${p.gender||'–'}</td>
      <td><div class="actions-wrapper">
        <button class="btn-action primary" onclick="window.location.href='patient_profile.html?id=${p.user_id}'">Open EMR</button>
        ${editBtn}
      </div></td></tr>`;
  });
}
function filterPatients() {
  const q = document.getElementById('pat-search').value.toLowerCase();
  renderPatients(patients.filter(p => p.name.toLowerCase().includes(q) || String(p.user_id).includes(q)));
}
function openPatEdit(p) {
  document.getElementById('edit-pat-id').value    = p.user_id;
  document.getElementById('edit-pat-name').value  = p.name;
  document.getElementById('edit-pat-gender').value = p.gender||'Male';
  document.getElementById('edit-pat-phone').value = p.mobile_no||'';
  document.getElementById('edit-pat-city').value  = p.city||'';
  document.getElementById('edit-pat-addr').value  = p.address||'';
  openModal('edit-pat-modal');
}
document.getElementById('edit-pat-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id  = document.getElementById('edit-pat-id').value;
  const res = await fetch(`/api/patients/${id}`, { method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name:document.getElementById('edit-pat-name').value, gender:document.getElementById('edit-pat-gender').value,
      mobile_no:document.getElementById('edit-pat-phone').value, city:document.getElementById('edit-pat-city').value,
      address:document.getElementById('edit-pat-addr').value }) });
  const data= await res.json();
  showNotification(data.message, !data.success);
  if (data.success) { closeModal('edit-pat-modal'); init(); }
});
function openModal(id)  { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
window.onload = init;
</script>
</body>
</html>
