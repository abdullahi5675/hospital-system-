<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registry — Clinic EMR</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>
<aside class="sidebar">
  <div class="sidebar-inner">
    <div class="sidebar-header">
      <div class="sidebar-brand" id="role-brand">Clinic EMR <span id="role-sub">Portal</span></div>
      <button class="sidebar-close-btn" onclick="closeSidebar()">✕</button>
    </div>
    <ul class="sidebar-menu" id="role-menu">
      <!-- Injected based on role -->
    </ul>
    <div class="sidebar-footer">
      <div class="user-badge"><span class="user-name">Loading…</span><span class="user-role">Guest</span></div>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>
  </div>
</aside>

<div class="main-wrapper">
  <div class="topbar">
    <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Toggle menu">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <span class="topbar-title">Patient Registry</span>
    <div class="topbar-right">
      <span class="topbar-role-badge" id="topbar-badge">–</span>
    </div>
  </div>

  <div class="page-content">
    <div class="page-header">
      <div class="page-title">
        <h1>Patient Registry Directory</h1>
        <p>Read-only hospital manifest of presenting patient names and admission dates</p>
      </div>
    </div>

    <div class="card-section">
      <div class="search-bar">
        <input type="text" id="reg-search" placeholder="Search by Patient ID or Name…" oninput="filterRegistry()">
      </div>
      <div class="table-wrapper">
        <table id="registry-table">
          <thead>
            <tr><th>Patient ID</th><th>Patient Name</th><th>Gender</th><th>Record Opened</th></tr>
          </thead>
          <tbody><tr><td colspan="4" class="text-center text-muted">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="status-banner" class="banner"></div>

<script src="js/app.js"></script>
<script>
  let patients = [];

  async function initCheck() {
    const activeUser = await checkAuth(['Admin', 'Doctor']);
    if (!activeUser) return;

    const menu  = document.getElementById('role-menu');
    const sub   = document.getElementById('role-sub');
    const badge = document.getElementById('topbar-badge');
    badge.textContent = activeUser.role;

    if (activeUser.role === 'Admin') {
      sub.textContent = 'Admin Panel';
      menu.innerHTML = `
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="doctors.html">Manage Doctors</a></li>
        <li><a href="add_doctor.html">Add Doctor</a></li>
        <li><a href="patients.html">Manage Patients</a></li>
        <li><a href="add_patient.html">Add Patient</a></li>
        <li><a href="add_room.html">Add Room / Beds</a></li>
        <li class="active"><a href="view_patients.html">Registry Directory</a></li>`;
    } else if (activeUser.role === 'Doctor') {
      sub.textContent = 'Doctor Panel';
      menu.innerHTML = `
        <li><a href="doctor.html">Dashboard</a></li>
        <li><a href="patients.html">Patients Directory</a></li>
        <li class="active"><a href="view_patients.html">Registry Directory</a></li>`;
    } else {
      sub.textContent = 'Patient Portal';
      menu.innerHTML = `
        <li><a href="patient.html">My Dashboard</a></li>
        <li><a href="patient_profile.html">My EMR File</a></li>
        <li class="active"><a href="view_patients.html">Registry Directory</a></li>`;
    }

    await loadRegistry();
  }

  async function loadRegistry() {
    try {
      const res  = await fetch('/api/patients');
      const data = await res.json();
      if (data.success) { patients = data.patients; renderRegistry(patients); }
      else showNotification(data.message, true);
    } catch (err) { showNotification(err.message, true); }
  }

  function renderRegistry(list) {
    const body = document.querySelector('#registry-table tbody');
    body.innerHTML = '';
    if (!list.length) {
      body.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No patients cataloged.</td></tr>';
      return;
    }
    list.forEach(p => {
      body.innerHTML += `<tr>
        <td>#${p.user_id}</td>
        <td><strong>${p.name}</strong></td>
        <td>${p.gender || '–'}</td>
        <td>${new Date(p.created_at).toLocaleDateString()}</td>
      </tr>`;
    });
  }

  function filterRegistry() {
    const q = document.getElementById('reg-search').value.toLowerCase();
    renderRegistry(patients.filter(p =>
      p.name.toLowerCase().includes(q) || p.user_id.toString().includes(q)
    ));
  }

  window.onload = initCheck;
</script>
</body>
</html>
